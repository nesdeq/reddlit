name: reddlit
description: A minimalist Reddit reader with AI-powered article summarization
publish_to: 'none'
version: 1.6.0+12

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.1"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  html: ^0.15.7
  cached_network_image: ^4.0.7
  provider: ^6.1.5+1
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  youtube_player_flutter: ^11.0.0
  shared_preferences: ^2.5.6
  # v10 migrates data written by v9's default ciphers; v11 drops them, so no release may skip v10.
  flutter_secure_storage: ^10.3.4
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  # Stable 6.1.5 does not build with AGP 9; this is the first release that does.
  flutter_inappwebview: ^6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  video_player_platform_interface: ^6.9.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FF4500"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-SourceSans3.txt
    - assets/fonts/OFL-SourceSerif4.txt
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
